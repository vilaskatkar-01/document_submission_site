<!DOCTYPE html>
<html>
<head>
    <title>Register - Document Submission</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 Register</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 10px; margin: 10px 0; border-radius: 4px; 
                        {% if category == 'success' %}background: #d4edda; color: #155724;
                        {% else %}background: #f8d7da; color: #721c24;{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="container auth-container">
    <!-- Back Button -->
    <div style="margin-bottom: 15px;">
        <a href="/" style="color: #667eea; text-decoration: none; font-size: 14px;">
            ⬅ Back to Home
        </a>
    </div>
    
    <div style="text-align: center; margin-bottom: 30px;">
        <!-- rest of the register page -->

        
        <form action="/register" method="POST" style="margin-top: 20px;">
            <div style="margin-bottom: 15px;">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="role">Role:</label><br>
                <select id="role" name="role" style="width: 100%; padding: 8px; margin-top: 5px;">
                    <option value="submitter">Submitter (can upload documents)</option>
                    <option value="admin">Admin (can manage everything)</option>
                </select>
            </div>
            <button type="submit" style="width: 100%;">Register</button>
        </form>
        <p style="margin-top: 15px;">Already have an account? <a href="/login">Login here</a></p>
    </div>

    
</body>
</html>
